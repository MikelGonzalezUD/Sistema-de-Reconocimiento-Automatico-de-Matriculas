version: '3.8'

services:
  db:
    image: postgres:16
    container_name: alpr_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  api:
    build:
      context: .       
      dockerfile: src/api/Dockerfile
    container_name: alpr_api
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - db
    env_file: 
      .env

  dashboard:
    build:
      context: .       
      dockerfile: src/dashboard/Dockerfile
    container_name: alpr_dashboard
    volumes:
      - .:/app
    environment:
      - DB_HOST=db  
      - DB_PORT=5432
    ports:
      - "8501:8501"
    env_file: .env
    depends_on:
      - db
    restart: always

volumes:
  postgres_data: